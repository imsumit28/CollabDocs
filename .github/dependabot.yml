version: 2
updates:
  # npm dependencies (monorepo root governs the client/ + server/ workspaces
  # via the single root package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions in the CI workflow up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
