name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=client
      - run: npm run lint --workspace=server

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check --workspace=client
      - run: npm run type-check --workspace=server

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build server
        run: npm run build --workspace=server
        env:
          NODE_ENV: production
      - name: Build client
        run: npm run build --workspace=client
        env:
          NEXT_PUBLIC_API_URL: https://api.collabdocs.app
          NEXT_PUBLIC_SOCKET_URL: https://api.collabdocs.app
