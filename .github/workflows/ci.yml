name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Cache the mongod binary that mongodb-memory-server downloads so the
      # server test suite doesn't re-download it on every run.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries

      - name: Install dependencies
        run: npm ci

      - name: Type-check (client + server)
        run: npm run type-check

      - name: Lint (client + server)
        run: npm run lint

      - name: Server tests (with coverage)
        working-directory: server
        run: npm run test:ci

      - name: Client tests
        working-directory: client
        run: npm run test:ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        working-directory: client
        run: npm run test:e2e
