<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="outline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background -->
  <!-- Add a dark rectangle if desired -->

  <!-- Document -->
  <path
    d="M170 70
       H330
       L390 130
       V420
       Q390 440 370 440
       H170
       Q150 440 150 420
       V90
       Q150 70 170 70Z"
    fill="none"
    stroke="url(#outline)"
    stroke-width="8"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M330 70V130H390"
    fill="none"
    stroke="url(#outline)"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Text -->
  <rect x="210" y="120" width="110" height="10" rx="5" fill="#3B82F6"/>
  <rect x="210" y="170" width="170" height="10" rx="5" fill="#475569"/>
  <rect x="210" y="220" width="170" height="10" rx="5" fill="#475569"/>
  <rect x="210" y="220" width="95" height="10" rx="5" fill="url(#teal)"/>
  <rect x="210" y="270" width="170" height="10" rx="5" fill="#475569"/>
  <rect x="210" y="320" width="170" height="10" rx="5" fill="#475569"/>
  <rect x="210" y="320" width="85" height="10" rx="5" fill="url(#purple)"/>
  <rect x="210" y="370" width="170" height="10" rx="5" fill="#475569"/>

  <!-- Bottom Dots -->
  <circle cx="285" cy="405" r="6" fill="#3B82F6"/>
  <circle cx="305" cy="405" r="6" fill="#8B5CF6"/>
  <circle cx="325" cy="405" r="6" fill="#2DD4BF"/>

  <!-- Left User -->
  <circle cx="70" cy="120" r="28" fill="#2563EB"/>
  <circle cx="70" cy="112" r="8" fill="white"/>
  <path d="M56 136c2-10 26-10 28 0" fill="white"/>

  <path
    d="M98 120
       C120 120 125 160 150 160"
    stroke="#2563EB"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Cursor -->
  <polygon
    points="170,180 185,205 170,200 165,215 155,185"
    fill="#3B82F6"/>

  <!-- Right User -->
  <circle cx="440" cy="240" r="28" fill="#14B8A6"/>
  <circle cx="440" cy="232" r="8" fill="white"/>
  <path d="M426 256c2-10 26-10 28 0" fill="white"/>

  <path
    d="M412 240
       C385 240 370 260 340 260"
    stroke="#14B8A6"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
  />

  <polygon
    points="320,245 345,255 325,280"
    fill="#14B8A6"/>

  <!-- Bottom User -->
  <circle cx="70" cy="360" r="28" fill="#7C3AED"/>
  <circle cx="70" cy="352" r="8" fill="white"/>
  <path d="M56 376c2-10 26-10 28 0" fill="white"/>

  <path
    d="M98 360
       H165
       C185 360 205 340 225 320"
    stroke="#7C3AED"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
  />

  <polygon
    points="215,300 235,320 205,325"
    fill="#7C3AED"/>

</svg>
