<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · CollabDocs</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F7; color: #1D1D1F;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #6E6E73; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #2563EB; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .dot { width: 56px; height: 56px; border-radius: 50%; background: #E8E8ED; margin: 0 auto;
           display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>CollabDocs can't reach the network right now. Documents you've opened are still available, and your edits sync automatically once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
